# ---------------------------------------------------------------------------
# Nginx configuration - the frontend service has two roles:
#   1) web server: serves the static files (HTML, JS, CSS)
#   2) reverse proxy: forwards /api/... requests to the backend
# From the outside, ONLY this single entry point is visible; the API and the
# database stay hidden on the internal overlay networks.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Every response says which frontend replica served it.
    add_header X-Frontend-Host $hostname always;

    # Docker's embedded DNS server runs at 127.0.0.11 in every container.
    # Because proxy_pass uses a variable, Nginx resolves the name "api" at
    # runtime, again and again - so it does not crash if the API does not
    # exist yet at startup, and it notices if the service IP changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $api_upstream;               # e.g. /api/tasks -> http://api:8000/api/tasks
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # The frontend's own healthcheck endpoint.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
